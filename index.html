<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FC Santos Mobile 27</title>
<style>
  :root {
    --bg: #070b14;
    --bg-2: #0d1526;
    --card: #121c33;
    --card-2: #172340;
    --line: rgba(255,255,255,.10);
    --text: #f4f7ff;
    --muted: #93a3c4;
    --accent: #00e5a8;
    --accent-2: #38bdf8;
    --gold: #fbbf24;
    --gold-2: #f59e0b;
    --danger: #ef4444;
    --purple: #a855f7;
    --neon: #00e5a8;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at top, #132242 0%, var(--bg) 62%);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  button, input {
    font-family: inherit;
    color: inherit;
  }

  /* ==================== PANTALLA DE BIENVENIDA ==================== */
  #splash-screen {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 18px 34px;
    background:
      radial-gradient(circle at 20% 25%, rgba(0, 229, 168, .18), transparent 42%),
      radial-gradient(circle at 80% 20%, rgba(251, 191, 36, .20), transparent 45%),
      linear-gradient(180deg, #070d1b 0%, #0a1224 55%, #050811 100%);
    overflow: hidden;
    transition: opacity .45s ease, transform .45s ease;
  }

  #splash-screen.hidden {
    opacity: 0;
    transform: scale(1.04);
    pointer-events: none;
  }

  .stadium-beams {
    position: absolute;
    inset: -20%;
    background:
      conic-gradient(from 160deg at 20% 0%, transparent 0deg, rgba(255,255,255,.07) 18deg, transparent 36deg),
      conic-gradient(from 195deg at 50% 0%, transparent 0deg, rgba(0,229,168,.08) 18deg, transparent 36deg),
      conic-gradient(from 230deg at 80% 0%, transparent 0deg, rgba(251,191,36,.09) 18deg, transparent 36deg);
    animation: beamSweep 8s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes beamSweep {
    0% { transform: rotate(-3deg) scale(1); }
    100% { transform: rotate(3deg) scale(1.06); }
  }

  .splash-top {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .splash-badge {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
    color: var(--gold);
  }

  .splash-stars-bg {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    align-items: end;
    margin: auto 0;
    padding: 12px 0;
  }

  .star-poster {
    position: relative;
    border-radius: 20px;
    padding: 12px 10px;
    background: linear-gradient(165deg, rgba(255,255,255,.12), rgba(14,23,44,.75));
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 18px 36px rgba(0,0,0,.55);
    text-align: center;
    overflow: hidden;
  }

  .star-poster.messi {
    transform: translateY(-10px);
    border-color: rgba(0, 229, 168, .45);
    animation: floatCard 3.2s ease-in-out infinite;
  }

  .star-poster.ronaldo {
    transform: translateY(8px);
    border-color: rgba(251, 191, 36, .45);
    animation: floatCard 3.6s ease-in-out .4s infinite;
  }

  .star-poster.mbappe {
    transform: translateY(-4px);
    border-color: rgba(56, 189, 248, .45);
    animation: floatCard 3.4s ease-in-out .8s infinite;
  }

  @keyframes floatCard {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -7px; }
  }

  .star-poster .poster-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .08em;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(0,0,0,.45);
    margin-bottom: 8px;
  }

  .star-poster .poster-name {
    margin-top: 8px;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: .04em;
  }

  .star-poster .poster-role {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .splash-bottom {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .splash-title {
    margin: 0;
    font-size: clamp(24px, 7vw, 34px);
    font-weight: 950;
    line-height: 1.06;
    letter-spacing: .02em;
    text-transform: uppercase;
    text-shadow: 0 6px 28px rgba(0, 229, 168, .28);
  }

  .splash-title span {
    display: block;
    background: linear-gradient(90deg, var(--accent), var(--gold), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .splash-sub {
    margin: 10px auto 20px;
    max-width: 420px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }

  .btn-start {
    width: 100%;
    max-width: 380px;
    border: none;
    border-radius: 18px;
    padding: 16px 22px;
    font-size: 16px;
    font-weight: 950;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #04111a;
    background: linear-gradient(90deg, var(--accent), #4ade80, var(--gold));
    box-shadow: 0 12px 30px rgba(0, 229, 168, .35);
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
  }

  .btn-start:active {
    transform: scale(.97);
    filter: brightness(.95);
  }

  /* ==================== CONTENEDOR PRINCIPAL ==================== */
  #app {
    max-width: 780px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: 12px 12px 92px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: rgba(18, 28, 51, .88);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 10px 12px;
    backdrop-filter: blur(10px);
  }

  .club-box {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .club-crest {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-weight: 950;
    font-size: 14px;
    background: linear-gradient(135deg, var(--gold), #b45309);
    color: #09101f;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(251, 191, 36, .25);
  }

  .club-meta {
    min-width: 0;
  }

  .club-label {
    font-size: 10px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .club-name {
    font-size: 14px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .grl-pill {
    background: rgba(251, 191, 36, .14);
    border: 1px solid rgba(251, 191, 36, .35);
    border-radius: 12px;
    padding: 6px 10px;
    text-align: center;
    line-height: 1.05;
  }

  .grl-pill span {
    display: block;
    font-size: 9px;
    font-weight: 800;
    color: var(--gold);
  }

  .grl-pill strong {
    font-size: 15px;
    font-weight: 950;
  }

  .icon-btn {
    border: 1px solid var(--line);
    background: var(--card-2);
    border-radius: 12px;
    height: 36px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .icon-btn.primary {
    background: linear-gradient(90deg, var(--accent), #22c55e);
    color: #051218;
    border: none;
  }

  .wallet-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .wallet-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .wallet-item small {
    display: block;
    font-size: 9px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .05em;
  }

  .wallet-item strong {
    font-size: 13px;
    font-weight: 950;
  }

  .wallet-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 900;
    flex-shrink: 0;
  }

  /* ==================== VISTAS ==================== */
  .view {
    display: none;
    flex-direction: column;
    gap: 12px;
  }

  .view.active {
    display: flex;
    animation: fadeIn .2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 12px 28px rgba(0,0,0,.32);
  }

  .panel-title {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 950;
    letter-spacing: .02em;
  }

  .panel-sub {
    margin: 0 0 12px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ==================== INICIO (LAYOUT LATERAL DERECHO) ==================== */
  .home-grid {
    display: grid;
    grid-template-columns: 1.35fr .95fr;
    gap: 12px;
    align-items: start;
  }

  @media (max-width: 640px) {
    .home-grid {
      grid-template-columns: 1.15fr .95fr;
    }
    .wallet-bar {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .home-hero {
    position: relative;
    border-radius: 20px;
    padding: 16px;
    background:
      radial-gradient(circle at 85% 15%, rgba(251, 191, 36, .22), transparent 45%),
      linear-gradient(145deg, #16284c 0%, #0d1629 100%);
    border: 1px solid rgba(255,255,255,.14);
    overflow: hidden;
  }

  .home-hero h2 {
    margin: 6px 0 6px;
    font-size: 20px;
    font-weight: 950;
  }

  .home-hero p {
    margin: 0 0 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }

  .home-quick-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .side-events {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .event-side-btn {
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 18px;
    padding: 14px 12px;
    text-align: left;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform .15s ease, border-color .15s ease;
  }

  .event-side-btn:active {
    transform: scale(.97);
  }

  .event-side-btn.caja {
    background: linear-gradient(155deg, #3b2308 0%, #191224 100%);
    border-color: rgba(251, 191, 36, .45);
  }

  .event-side-btn.interfaz {
    background: linear-gradient(155deg, #092c29 0%, #101b35 100%);
    border-color: rgba(0, 229, 168, .45);
  }

  .event-chip {
    display: inline-block;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(0,0,0,.38);
    color: var(--gold);
  }

  .event-side-btn.interfaz .event-chip {
    color: var(--accent);
  }

  .event-side-btn h3 {
    margin: 8px 0 3px;
    font-size: 15px;
    font-weight: 950;
  }

  .event-side-btn small {
    display: block;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.3;
  }

  .countdown-tag {
    margin-top: 8px;
    display: inline-block;
    font-size: 11px;
    font-weight: 900;
    color: #fde68a;
    background: rgba(245, 158, 11, .18);
    border: 1px solid rgba(251, 191, 36, .35);
    padding: 4px 8px;
    border-radius: 8px;
  }

  /* ==================== CARTAS DE JUGADORES ==================== */
  .cards-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .player-card {
    position: relative;
    border-radius: 16px;
    padding: 10px;
    background: linear-gradient(165deg, #243358 0%, #10182b 65%, #0b101d 100%);
    border: 1px solid rgba(251, 191, 36, .38);
    box-shadow: 0 10px 22px rgba(0,0,0,.42);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .player-card.tier-normal {
    border-color: rgba(148, 163, 184, .35);
    background: linear-gradient(165deg, #1e293b 0%, #0f172a 100%);
  }

  .player-card.tier-b {
    border-color: rgba(56, 189, 248, .5);
    background: linear-gradient(165deg, #132c4a 0%, #0d1629 100%);
  }

  .player-card.tier-a,
  .player-card.tier-legend {
    border-color: rgba(251, 191, 36, .75);
    background: linear-gradient(165deg, #422c09 0%, #1c162b 58%, #0c1222 100%);
  }

  .player-card.tier-secret {
    border-color: #f43f5e;
    box-shadow: 0 0 26px rgba(244, 63, 94, .38), 0 14px 28px rgba(0,0,0,.6);
    background: linear-gradient(165deg, #4c1228 0%, #271236 55%, #0c1020 100%);
  }

  .card-top {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    line-height: 1;
  }

  .card-ovr {
    font-size: 20px;
    font-weight: 950;
    color: var(--gold);
  }

  .card-pos {
    font-size: 11px;
    font-weight: 900;
    padding: 3px 6px;
    border-radius: 6px;
    background: rgba(255,255,255,.12);
  }

  .card-name {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 950;
    line-height: 1.15;
  }

  .card-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .card-stats {
    width: 100%;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,.10);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    font-size: 10px;
  }

  .card-stats span {
    display: block;
    color: var(--muted);
    font-size: 8px;
    font-weight: 800;
  }

  .card-stats strong {
    font-size: 11px;
  }

  /* ==================== DRAFT ==================== */
  .draft-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 12px 0;
  }

  .btn-spin {
    border: none;
    border-radius: 16px;
    padding: 14px 12px;
    font-weight: 950;
    cursor: pointer;
    text-align: center;
    transition: transform .14s ease;
  }

  .btn-spin:active {
    transform: scale(.97);
  }

  .btn-spin.single {
    background: linear-gradient(90deg, var(--accent), #16a34a);
    color: #041318;
  }

  .btn-spin.ten {
    background: linear-gradient(90deg, var(--gold), var(--gold-2));
    color: #1b1102;
  }

  .btn-spin small {
    display: block;
    font-size: 11px;
    font-weight: 800;
    opacity: .88;
    margin-top: 2px;
  }

  .pity-box {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  .pity-head {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .pity-track {
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }

  .pity-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width .3s ease;
  }

  .pity-fill.b {
    background: linear-gradient(90deg, #38bdf8, #818cf8);
  }

  .pity-fill.a {
    background: linear-gradient(90deg, #fbbf24, #f97316);
  }

  .pool-box {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ==================== CAJA MARADONA 125 ==================== */
  .caja-showcase {
    display: grid;
    grid-template-columns: 165px 1fr;
    gap: 14px;
    align-items: center;
    margin-bottom: 12px;
  }

  @media (max-width: 540px) {
    .caja-showcase {
      grid-template-columns: 1fr;
    }
  }

  .secret-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 900;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(244, 63, 94, .16);
    border: 1px solid rgba(244, 63, 94, .45);
    color: #fda4af;
    margin-bottom: 8px;
  }

  .caja-grid-12 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
  }

  @media (max-width: 480px) {
    .caja-grid-12 {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .caja-slot {
    border-radius: 14px;
    padding: 10px 8px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    text-align: center;
    min-height: 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }

  .caja-slot.claimed {
    opacity: .48;
    border-style: dashed;
    background: rgba(15, 23, 42, .5);
  }

  .caja-slot strong {
    font-size: 11px;
    line-height: 1.2;
  }

  .caja-slot span {
    font-size: 10px;
    color: var(--muted);
  }

  /* ==================== INTERFAZ MESSI 125 ==================== */
  .messi-offer-card {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 14px;
    align-items: center;
    background:
      radial-gradient(circle at top right, rgba(0, 229, 168, .22), transparent 50%),
      var(--bg-2);
    border: 1px solid var(--neon);
    box-shadow: 0 0 24px color-mix(in srgb, var(--neon) 25%, transparent);
    border-radius: 18px;
    padding: 14px;
  }

  @media (max-width: 540px) {
    .messi-offer-card {
      grid-template-columns: 1fr;
    }
  }

  .neon-swatches {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #fff;
    cursor: pointer;
  }

  /* ==================== TIENDA / MISIONES / TIROS / FICHAS ==================== */
  .shop-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .shop-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px;
  }

  .shop-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(56, 189, 248, .16);
    color: var(--accent-2);
    margin-bottom: 4px;
  }

  .shop-row h4 {
    margin: 0;
    font-size: 14px;
    font-weight: 900;
  }

  .shop-row p {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--muted);
  }

  .btn-buy {
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 950;
    background: linear-gradient(90deg, var(--accent), #22c55e);
    color: #051318;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-buy.gold {
    background: linear-gradient(90deg, var(--gold), var(--gold-2));
    color: #191002;
  }

  .btn-buy:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  .penalty-field {
    position: relative;
    height: 190px;
    border-radius: 18px;
    background:
      linear-gradient(180deg, #0b2342 0%, #103b2e 45%, #166534 46%, #14532d 100%);
    border: 1px solid rgba(255,255,255,.16);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px;
  }

  .goal-frame {
    margin: 0 auto;
    width: 72%;
    height: 68px;
    border: 3px solid #f8fafc;
    border-bottom: none;
    background: rgba(255,255,255,.07);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .goal-zone {
    border: 1px dashed
